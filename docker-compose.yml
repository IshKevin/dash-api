# Backend stack: PostgreSQL + SeaweedFS (S3 object storage) + API.
#
# Runs on its own. The frontend (Dashboard-avocado) has its own compose file;
# the two connect over HTTP (browser -> http://localhost:5000/api) and also
# share the "avocado-net" Docker network so containers can reach each other by
# name (e.g. http://dash-api:5000) when a reverse proxy is used.
#
#   docker compose up -d --build        # start everything
#   docker compose logs -f api          # follow API logs
#   docker compose down                 # stop (data kept in volumes)
#   docker compose down -v              # stop and wipe DB + files

name: avocado-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: dash-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashpass}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_avocado}
    ports:
      # Bound to localhost only — the database must never be reachable from outside.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dashuser} -d ${POSTGRES_DB:-dashboard_avocado}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [avocado-net]

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: dash-api-seaweedfs
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/opt/seaweedfs/start.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedadmin123}
      SEAWEED_ADVERTISE_IP: seaweedfs
    ports:
      # S3 API — exposed for local debugging (aws cli / s3 browser). Remove in production.
      - '127.0.0.1:${S3_HOST_PORT:-8333}:8333'
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/start.sh:/opt/seaweedfs/start.sh:ro
    healthcheck:
      # The S3 gateway only answers once master, volume and filer are all up.
      test: ['CMD-SHELL', 'wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/1.1"']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks: [avocado-net]

  api:
    build:
      context: .
      target: production
    image: avocado/dash-api:latest
    container_name: dash-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashuser}:${POSTGRES_PASSWORD:-dashpass}@postgres:5432/${POSTGRES_DB:-dashboard_avocado}
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CORS_PUBLIC: ${CORS_PUBLIC:-false}
      APP_NAME: ${APP_NAME:-Dashboard Avocado Backend}
      APP_VERSION: ${APP_VERSION:-2.1.0}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedadmin123}
      S3_BUCKET: ${S3_BUCKET:-avocado-dashboard}
      # Base URL browsers use to reach this API; public image URLs are built from it.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      DRY_MATTER_MIN_PCT: ${DRY_MATTER_MIN_PCT:-23}
      LAND_REGISTRY_API_URL: ${LAND_REGISTRY_API_URL:-}
      LAND_REGISTRY_API_KEY: ${LAND_REGISTRY_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@avocadodashboard.com}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Demo accounts with known passwords: on for local testing, set false for production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-200}
    ports:
      - '${API_HOST_PORT:-5000}:5000'
    # Image CMD (entrypoint.sh): migrate deploy -> seed demo accounts -> start server
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks: [avocado-net]

networks:
  avocado-net:
    name: avocado-net

volumes:
  postgres_data:
  seaweedfs_data:
