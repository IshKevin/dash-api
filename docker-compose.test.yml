# Isolated TEST stack: throwaway PostgreSQL + SeaweedFS (tmpfs, nothing
# persisted) and a test-runner container. Uses different host ports and its own
# project name, so it never touches the dev/prod data in docker-compose.yml.
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v
#
# Or start only the test DB + storage and run tests from your host:
#   docker compose -f docker-compose.test.yml up -d postgres-test seaweedfs-test
#   DATABASE_URL=postgresql://testuser:testpass@localhost:5433/dashboard_avocado_test \
#   S3_ENDPOINT=http://localhost:8334 S3_ACCESS_KEY=testkey S3_SECRET_KEY=testsecret \
#   JWT_SECRET=test-secret npx prisma migrate deploy && npm test

name: avocado-backend-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: dashboard_avocado_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testuser -d dashboard_avocado_test']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-test:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ['/bin/sh', '/opt/seaweedfs/start.sh']
    environment:
      S3_ACCESS_KEY: testkey
      S3_SECRET_KEY: testsecret
      SEAWEED_ADVERTISE_IP: seaweedfs-test
    ports:
      - '8334:8333'
    tmpfs:
      - /data
    volumes:
      - ./docker/seaweedfs/start.sh:/opt/seaweedfs/start.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "HTTP/1.1"']
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  tests:
    build:
      context: .
      target: test
    depends_on:
      postgres-test:
        condition: service_healthy
      seaweedfs-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://testuser:testpass@postgres-test:5432/dashboard_avocado_test
      JWT_SECRET: test-jwt-secret-not-for-production
      S3_ENDPOINT: http://seaweedfs-test:8333
      S3_ACCESS_KEY: testkey
      S3_SECRET_KEY: testsecret
      S3_BUCKET: avocado-test
      PUBLIC_API_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
